    <script>
      (function() {
        // Neutralize Vite HMR WebSocket connection in AI Studio iframe
        try {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.indexOf('@vite') !== -1 || url.indexOf('vite-ws') !== -1))
              ) {
                var target = new EventTarget();
                target.readyState = 1;
                target.send = function() {};
                target.close = function() {};
                setTimeout(function() {
                  try {
                    target.dispatchEvent(new Event('open'));
                  } catch (e) {}
                }, 10);
                return target;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        // Suppress unhandled WebSocket rejections from bubbling to platform error boundary
        window.addEventListener('unhandledrejection', function(event) {
          var str = event && event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var str = event && event.message ? String(event.message) : '';
          var fn = event && event.filename ? String(event.filename) : '';
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            fn.indexOf('@vite/client') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
